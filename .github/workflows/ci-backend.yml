name: ci-backend

on:
  pull_request:
    paths:
      - backend/**
      # ワークフロー自身の変更も同じ検証を通す
      - .github/workflows/ci-backend.yml

permissions:
  contents: read

# 同一 PR への連続 push で古い実行を打ち切る
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        # just lint に寄せず Action のまま使う (バイナリと Go モジュールのキャッシュを活かすため)
        # そのためバージョンはルートの .tool-versions (ローカル、asdf) とここの version の
        # 2 か所で管理している。更新時は両方を揃えること
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          # 設定は backend/.golangci.yml
          version: v2.12.2
          # uses ステップには defaults.run.working-directory が効かない
          working-directory: backend

  build-test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # asdf と同じ値を使うためルートの .tool-versions から golang 行を読む
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check formatting
        # just fmt はファイルを書き換えるため差分の有無で未整形を検出する
        run: |
          just fmt
          git diff --exit-code

      - name: Build
        run: go build ./...

      - name: Vet
        run: just vet

      - name: Test
        env:
          # 課金が発生する Textract と Bedrock を叩かせないため IMDS 経由の
          # クレデンシャル取得を止める (OIDC も permissions で与えていない)
          AWS_EC2_METADATA_DISABLED: "true"
        run: just test

  trivy-vuln:
    name: trivy vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Trivy version
        id: trivy-version
        # trivy-action には .tool-versions を読む入力が無いため、asdf と同じ行から版を取り出して渡す (v を付ける)
        run: |
          version=$(awk '$1 == "trivy" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test -n "$version"
          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scan
        # go.mod の依存関係 (直接・間接) の既知脆弱性を検査する。ローカルは trivy fs --scanners vuln backend で同じ検査ができる
        # 修正版が無い脆弱性も隠さない (ignore-unfixed は既定の false)。受容するなら理由を書いた .trivyignore を trivyignores 入力で渡す
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ steps.trivy-version.outputs.version }}
          scan-type: fs
          # uses ステップには defaults.run.working-directory が効かない
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
