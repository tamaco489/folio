name: ci-backend

on:
  pull_request:
    paths:
      - backend/**
      # ワークフロー自身の変更も同じ検証を通す
      - .github/workflows/ci-backend.yml

permissions:
  contents: read

# 同一 PR への連続 push で古い実行を打ち切る
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          # 設定は backend/.golangci.yml
          version: v2.12.2
          # uses ステップには defaults.run.working-directory が効かない
          working-directory: backend

  build-test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # asdf と同じ値を使うためルートの .tool-versions から golang 行を読む
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check formatting
        # just fmt はファイルを書き換えるため差分の有無で未整形を検出する
        run: |
          just fmt
          git diff --exit-code

      - name: Build
        run: go build ./...

      - name: Vet
        run: just vet

      - name: Test
        env:
          # 課金が発生する Textract と Bedrock を叩かせないため IMDS 経由の
          # クレデンシャル取得を止める (OIDC も permissions で与えていない)
          AWS_EC2_METADATA_DISABLED: "true"
        run: just test
